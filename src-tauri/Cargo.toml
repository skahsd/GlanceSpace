[package]
name = "glancespace"
version = "0.1.0"
description = "Windows read-only disk space analyzer"
edition = "2021"
rust-version = "1.85"

[lib]
name = "glancespace_lib"

[[bin]]
name = "glancespace"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-plugin-dialog", "dep:tauri-build"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
serde = { version = "1", features = ["derive"] }
walkdir = "2.5"
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_Foundation", "Win32_System_SystemServices", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging"] }
tauri = { version = "2", optional = true, features = [] }
tauri-plugin-dialog = { version = "2", optional = true }

[dev-dependencies]
tempfile = "3"
